<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<title>TBH HUD 迷你</title>
<style>
  /* v1.0.16 (P4) — the mini-HUD: a dumb display fed by the dashboard window over IPC. It computes NOTHING
     from the save itself (one engine, one data lane); only the offline-idle clock ticks locally from the
     last-save anchor it was handed. Drag anywhere; the ✕ closes it. */
  :root[data-theme="dark"]{--bg:#10141f;--card:#1c2235;--border:#2a3350;--text:#e8ecf8;--dim:#8491b6;
    --gold:#f2c14e;--good:#4cc38a;--accent:#7d96ff}
  :root[data-theme="light"]{--bg:#f4f6fb;--card:#ffffff;--border:#d6dcEC;--text:#1c2433;--dim:#5d6a85;
    --gold:#a07412;--good:#1d7a4f;--accent:#3a4fd8}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font:12.5px/1.45 system-ui,'Segoe UI',sans-serif;
    -webkit-app-region:drag;user-select:none;padding:10px 12px;overflow:hidden;
    border:1px solid var(--border);border-radius:0}
  .top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .ttl{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--dim)}
  .sample{font-size:9px;font-weight:800;letter-spacing:.06em;color:#b8860b;border:1px solid #b8860b;
    border-radius:4px;padding:0 4px}
  .x{margin-left:auto;-webkit-app-region:no-drag;cursor:pointer;border:none;background:none;color:var(--dim);
    font-size:14px;line-height:1;padding:2px 6px;border-radius:5px}
  .x:hover{color:var(--text);background:var(--card)}
  .rows{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .cell{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 9px;min-width:0}
  .cell.w{grid-column:1/-1}
  .k{font-size:9px;font-weight:700;letter-spacing:.07em;color:var(--dim);text-transform:uppercase}
  .v{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .v small{font-size:10.5px;font-weight:600;color:var(--dim)}
  .v.gold{color:var(--gold)} .v.good{color:var(--good)} .v.acc{color:var(--accent)}
  .empty{color:var(--dim);font-size:12px;text-align:center;padding:22px 6px}
</style>
</head>
<body>
<div class="top"><span class="ttl">TBH HUD</span><span class="sample" id="sample" hidden>SAMPLE</span>
  <button class="x" id="closeBtn" title="关闭迷你 HUD">✕</button></div>
<div id="content"><div class="empty">等待仪表盘…<br>（它读取你的存档并反馈到此窗口）</div></div>
<script>
'use strict';
/* 迷你 HUD 语言检测：与 dashboard 共享 localStorage.tbh_lang，默认中文。 */
var ZH=(function(){try{return localStorage.getItem('tbh_lang')!=='en';}catch(e){return true;}})();
function L(en,zh){return ZH?zh:en;}
var P=null;
function fmt(n){return n==null?'—':Number(n).toLocaleString();}
function fmtDur(sec){sec=Math.max(0,Math.floor(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  if(h>0)return h+(ZH?'小时 ':'h ')+(m<10?'0':'')+m+(ZH?'分':'m'); if(m>0)return m+(ZH?'分 ':'m ')+(s<10?'0':'')+s+(ZH?'秒':'s'); return s+(ZH?'秒':'s');}
function offLine(){
  if(!P||!P.savedMs)return '—';
  var idle=(Date.now()-P.savedMs)/1000;
  if(P.capSec!=null){
    if(idle>=P.capSec)return L('AT CAP (','已满（')+fmtDur(P.capSec)+')';
    return fmtDur(idle)+' <small>'+L('cap in ','还有 ')+fmtDur(P.capSec-idle)+L('',' 到上限')+'</small>';
  }
  return fmtDur(idle)+' <small>'+L('idle','挂机')+'</small>';
}
function render(){
  var c=document.getElementById('content');
  document.getElementById('sample').hidden=!(P&&P.sample);
  if(!P){return;}
  document.documentElement.dataset.theme=(P.theme==='light')?'light':'dark';
  var rune=P.rune?((P.rune.afford?'✓ ':'')+P.rune.n+' <small>'+(P.rune.afford?L('affordable · ','可负担 · '):L('save ','攒 '))+fmt(P.rune.cost)+(ZH?'金':'g')+'</small>'):'—';
  c.innerHTML='<div class="rows">'+
    '<div class="cell"><div class="k">'+L('Gold','金币')+'</div><div class="v gold">'+fmt(P.gold)+'</div></div>'+
    '<div class="cell"><div class="k">'+L('Session gold/hr','本次金币/小时')+'</div><div class="v good">'+(P.gph==null?L('measuring…','测量中…'):fmt(P.gph))+'</div></div>'+
    '<div class="cell w"><div class="k">'+L('Stage','关卡')+'</div><div class="v">'+(P.stage||'—')+(P.wave?(' <small>'+L('wave ','第 ')+P.wave+L('',' 波')+'</small>'):'')+(P.stageName?(' <small>'+P.stageName+'</small>'):'')+'</div></div>'+
    '<div class="cell"><div class="k">'+L('Since last save','自上次存档')+'</div><div class="v" id="offv">'+offLine()+'</div></div>'+
    '<div class="cell"><div class="k">'+L('Next rune','下一符文')+'</div><div class="v acc" title="'+L("Cheapest next rune step from the dashboard's plan",'仪表盘计划中最便宜的下一级符文')+'">'+rune+'</div></div>'+
    '</div>';
}
if(window.tbhNative&&window.tbhNative.onMiniData){
  window.tbhNative.onMiniData(function(p){P=p;render();});
}
document.getElementById('closeBtn').addEventListener('click',function(){
  if(window.tbhNative&&window.tbhNative.miniClose)window.tbhNative.miniClose();
});
// only the idle clock ticks locally — everything else waits for the next save read
setInterval(function(){var v=document.getElementById('offv');if(v&&P&&P.savedMs)v.innerHTML=offLine();},1000);
</script>
</body>
</html>
