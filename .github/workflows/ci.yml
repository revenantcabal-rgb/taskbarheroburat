name: CI

# Runs the committed unit + guard tests on every push / PR. Pure Node (no game, no save, no secrets) — the suite
# covers the crew identity & dedupe (the dup-row fix), the PvP Arena math, client/server hash parity, the runePlan
# data-honesty invariant, and the BAN-SAFETY guard (read-only · no process access · crew-only · whitelist-airtight).
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # node --test glob support landed in v21; 22 is current LTS
      # Only @neondatabase/serverless is needed to load api/_lib.js (the tests stub the DB / never connect).
      - name: Install the one runtime dep the tests load
        run: npm install --no-save @neondatabase/serverless@^0.10.4
      - name: Run tests
        run: node --test "tests/**/*.test.js"

  e2e:
    runs-on: ubuntu-latest
    # Renderer E2E (Playwright) — drives the real dashboard.html in demo mode through every tab + the
    # known regression hotspots (i18n restore, the Farming penalty column). The unit job covers the engine;
    # this covers the ~5,800-line UI that node --test cannot reach.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright + chromium
        run: npm install --no-save @playwright/test@^1.60.0 && npx playwright install --with-deps chromium
      - name: Run renderer E2E
        run: npx playwright test
